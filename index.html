<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单网页示例</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            font-size: 24px;
        }
        .container {
            margin: 20px auto;
            width: 80%;
            max-width: 600px;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    欢迎来到我的网页
</header>

<div class="container">
    <h2>你好，世界！</h2>
    <p>这是一个简单的 HTML 页面示例，包含基本的 CSS 样式和按钮交互。</p>
    <button onclick="sayHello()">点击我</button>
</div>

<script>
    function sayHello() {
        alert("Hello! 你点击了按钮！");
    }
</script>

</body>
</html>
